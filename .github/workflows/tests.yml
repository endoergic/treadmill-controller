name: tests

on:
  push:
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"   # the Pi runs Python 3.13 (Raspberry Pi OS 13 "trixie")
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q   # tests/conftest.py selects gpiozero's mock pins
