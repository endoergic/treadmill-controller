<title>Treadmill controller v1.0 — relay board schematic</title>
<style>.w{stroke:#000;stroke-width:2;fill:none}.t{fill:#000}.s{font-size:12px}.h{font-size:16px;font-weight:bold}.b{font-weight:bold}.m{fill:#444;font-size:12px}.bar{stroke:#000;stroke-width:1.5;stroke-dasharray:8 6;fill:none}.box{stroke:#000;stroke-width:2;fill:#fff}.dot{fill:#000}</style>
<rect x="0" y="0" width="1200" height="1544" fill="#ffffff"/>
<text x="40" y="44" style="font-size:22px;font-weight:bold">Treadmill controller v1.0 — relay board</text>
<text x="40" y="68" class="m">10 × Panasonic AQY212EH PhotoMOS relays between a Raspberry Pi Zero W and the console keypad connector HD6. Tested on a NordicTrack C2100 (NTL1085).</text>
<text x="40" y="108" class="h">(a) One channel in detail (×10)</text>
<text x="250" y="140" class="b">Pi side (3.3 V)</text>
<text x="900" y="140" class="b">Treadmill side</text>
<rect x="40" y="150" width="160" height="280" class="box"/>
<text x="120" y="290" text-anchor="middle" class="b">Raspberry Pi</text><text x="120" y="308" text-anchor="middle" class="b">Zero W</text>
<text x="192" y="185" text-anchor="end">GPIOxx</text>
<text x="192" y="405" text-anchor="end">GND</text>
<path class="w" d="M200 180 H300"/><circle class="dot" cx="300" cy="180" r="4"/>
<path class="w" d="M300 180 H340"/><rect x="340" y="170" width="80" height="20" class="box"/><path class="w" d="M420 180 H560"/>
<text x="380" y="162" text-anchor="middle">330 Ω</text>
<text x="490" y="172" text-anchor="middle" class="s">pin 1 (anode, dot)</text>
<path class="w" d="M300 180 V220"/><rect x="290" y="220" width="20" height="60" class="box"/><path class="w" d="M300 280 V305"/>
<text x="318" y="255" class="t">1 kΩ</text>
<path class="w" d="M286 305 H314 L300 330 Z M286 330 H314"/><path class="w" d="M300 330 V400"/>
<path class="w" d="M318 312 l14 -8 M326 302 l6 2 l-2 6 M318 324 l14 -8 M326 314 l6 2 l-2 6"/>
<text x="342" y="332" class="s">red indicator LED</text>
<text x="342" y="348" class="m">own path, not via relay</text>
<path class="w" d="M200 400 H470"/><circle class="dot" cx="300" cy="400" r="4"/>
<path class="w" d="M470 400 V300 H560"/>
<text x="474" y="292" class="s">pin 2 (cathode)</text>
<rect x="560" y="150" width="200" height="180" class="box"/>
<circle class="dot" cx="572" cy="162" r="4"/>
<text x="650" y="352" text-anchor="end" class="b">AQY212EH (DIP-4)</text>
<text x="566" y="176" class="s">1</text><text x="566" y="296" class="s">2</text><text x="746" y="296" class="s">3</text><text x="746" y="176" class="s">4</text>
<path class="w" d="M560 180 H610 V215"/><path class="w" d="M596 215 H624 L610 240 Z M596 240 H624"/><path class="w" d="M610 240 V300 H560"/>
<path class="w" d="M628 222 l18 -8 M640 211 l6 3 l-3 6 M628 236 l18 -8 M640 225 l6 3 l-3 6"/>
<path class="w" d="M760 180 H712 V210"/><circle class="dot" cx="712" cy="210" r="3"/><path class="w" d="M712 270 L692 216"/><circle class="dot" cx="712" cy="270" r="3"/><path class="w" d="M712 270 V300 H760"/>
<text x="700" y="250" text-anchor="end" class="s">switch</text>
<path class="bar" d="M660 120 V440"/><text x="660" y="115" text-anchor="middle" class="s">isolation barrier (no electrical connection)</text>
<path class="w" d="M760 180 H1000"/>
<text x="880" y="172" text-anchor="middle" class="s">pin 4 → ribbon wire n</text>
<rect x="1000" y="160" width="160" height="40" class="box"/><text x="1080" y="185" text-anchor="middle" class="b">HD6 pin n</text>
<text x="1000" y="220" class="m">console keypad line</text><text x="1000" y="236" class="m">(pins 2–9 idle at +3.4 V;</text><text x="1000" y="252" class="m">pins 1 and 10 = console GND)</text>
<path class="w" d="M760 300 H860 V400"/><circle class="dot" cx="860" cy="400" r="4"/><path class="w" stroke-width="3" d="M800 400 H1160" style="stroke-width:4"/>
<text x="790" y="292" class="s">pin 3</text>
<text x="880" y="390" class="b">SHARED line (S rail)</text>
<text x="880" y="422" class="m">pin 3 of all 10 relays; stays on the board,</text><text x="880" y="438" class="m">never wired to the treadmill</text>
<text x="40" y="470" class="m">Relay LED ≈ (3.3 V − 1.3 V) / 330 Ω ≈ 6 mA (trigger ≤ 3 mA) · indicator ≈ 1.5 mA · max 5 relays on at once (max_relays_on).</text>
<text x="40" y="488" class="m">No 10 kΩ pull-downs: these GPIOs default to pull-down at boot, so all relays start open (fail open). Pi GND never touches the treadmill.</text>
<path d="M40 515 H1160" stroke="#000" stroke-width="1"/>
<text x="40" y="550" class="h">(b) Board overview: 10 channels</text>
<text x="40" y="572" class="m">Each box is one channel as in (a): 330 Ω + relay LED, 1 kΩ + indicator LED, returns to Pi GND (pin 39). Ribbon colors: pin 1 black … pin 10 brown.</text>
