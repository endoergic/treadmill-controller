<text x="802" y="1290" class="b">SHARED line (S rail)</text>
<text x="802" y="1306" class="m">all pin-3 sides; on the board only</text>
<text x="880" y="600" text-anchor="middle" class="m">pin-4 sides → HD6 1–10</text>
<rect x="40" y="1326" width="1120" height="62" fill="#f4f4f4" stroke="#000" stroke-width="1"/>
<text x="56" y="1350" class="b">Command = close select relays (e.g. 2+7) → 50 ms → close relay 1 (Go, pin 1 = console ground) for 300 ms → release</text>
<text x="56" y="1372" class="m">Go joins the SHARED line to console ground, which grounds the selected lines = one button press. Go is released first, then all. Command map: docs/hardware/button-map.md</text>
